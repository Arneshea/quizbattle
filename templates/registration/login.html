{% extends 'base.html' %}
{% block title %}Host login{% endblock %}
{% block width %}420px{% endblock %}
{% block content %}
<div class="card p-4">
    <h4 class="mb-3 text-center">Host login</h4>
    <form method="post">
        {% csrf_token %}
        {% if form.errors %}<div class="alert alert-danger">Wrong username or password.</div>{% endif %}
        <div class="mb-3"><label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" required autofocus></div>
        <div class="mb-3"><label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required></div>
        <input type="hidden" name="next" value="{{ next }}">
        <button class="btn btn-primary w-100">Log in</button>
    </form>
    <p class="text-center text-muted mt-3 mb-0">No account? <a href="{% url 'signup' %}">Sign up</a></p>
</div>
{% endblock %}
