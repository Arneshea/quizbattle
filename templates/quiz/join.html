{% extends 'base.html' %}
{% block title %}Join a quiz{% endblock %}
{% block width %}420px{% endblock %}
{% block content %}
<div class="card p-4">
    <h3 class="mb-3 text-center">Join a Quiz Battle</h3>
    {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Room code</label>
            <input type="text" name="room_code" class="form-control form-control-lg text-uppercase text-center"
                   maxlength="6" autocomplete="off" required autofocus>
        </div>
        <div class="mb-3">
            <label class="form-label">Your name</label>
            <input type="text" name="name" class="form-control form-control-lg" maxlength="100" required>
        </div>
        <button class="btn btn-primary btn-lg w-100">Join</button>
    </form>
</div>
{% endblock %}
